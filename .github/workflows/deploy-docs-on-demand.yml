name: Deploy Docs (On-Demand)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Documentation Version"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Install exactly what uv.lock pins, as the image does.
      UV_FROZEN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          # The version the Dockerfile uses.
          version: "0.7.4"

      - name: Build the docs strictly
        run: make docs-test

      - name: Configure git
        run: |
          git config user.name "datagems-ci[bot]"
          git config user.email "datagems-ci[bot]@datagems.eu"

      - name: Fetch existing gh-pages branch
        run: git fetch origin gh-pages:gh-pages

      - name: Publish docs
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          uv run --group docs mike deploy --push --update-aliases "$VERSION" latest --config-file docs/mkdocs.yml
          uv run --group docs mike set-default --push latest --config-file docs/mkdocs.yml
